[project]
name = "trailmap"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fitdecode>=0.10", "gpxpy>=1.6", "fastapi>=0.115", "uvicorn[standard]>=0.30", "httpx>=0.27", "numpy>=1.26", "pillow>=10", "osmium>=4.0", "python-multipart>=0.0.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.game" = ["config/*.toml", "migrations/*.sql"]
