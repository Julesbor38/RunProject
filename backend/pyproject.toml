[project]
name = "trailmap"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fitdecode>=0.10", "gpxpy>=1.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
