# Shop. Every item is paid in points (earned by running) OR in gems (bought), as listed: give either price, or
# both. Rule: an item bought with gems is always deterministic — the buyer knows exactly what they get;
# `random = true` items (packs, later) may only have a points price, and must show their odds (checked when
# the config loads). A familier is sold once per account; it arrives as an egg and becomes the active one.

[[item]]
id = "oeuf_brasaltor"
kind = "pet"
species = "brasaltor"
price_points = 10000
price_gems = 1000

