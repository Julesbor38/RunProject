# Battles against bots: an endless trail of levels. Each level is 1 to 3 wild mobs (more often a group as the
# levels go up); every 5th level a mid-boss, every 10th a big boss (with a second phase). Enemy stats =
# their species' base x (base_scale + per_level x level) (their stage only changes their look and, for the
# bosses, their abilities); a mob in a group is weaker (group_scale). HP in battle = the hp stat x hp_factor.
#
# Rewards (points, apart from the monthly cap of running): first victory of a level reward_base +
# reward_per_level x level (x mid_boss_reward / boss_reward for the bosses), a level already won again:
# replay_share of it; at most daily_rewarded victories rewarded a day.

hp_factor = 5.0
base_scale = 0.35
per_level = 0.05
group_scale = 0.6
mob_total = 300              # every enemy's base stats are brought to this total (a starter's); bosses then get their scale
max_turns = 50
damage_scale = 0.5
crit_chance = 6
crit_multiplier = 1.5
random_spread = 10           # ±% on every blow

# weather: moves of the favoured type x weather_boost, of the hindered type x weather_malus; rain heals the
# Pluvieux rain_heal % of max HP a turn; snow chips snow_chip % at everyone not Glacé
weather_boost = 1.3
weather_malus = 0.75
rain_heal = 5
snow_chip = 3

# team trail (3 against 3): every enemy at team_scale (a guard of a boss at team_guard_scale on top)
team_scale = 1.0
team_guard_scale = 0.75

reward_base = 20
reward_per_level = 4
mid_boss_reward = 3
boss_reward = 5
replay_share = 0.25
daily_rewarded = 10

# wild mobs met on the trail, by stage as the levels go up (stage = 1 + level / mob_stage_every, max 3)
mob_species = ["galet", "fusette", "foulon", "colossaure", "tempestor", "sylvarion", "brasaltor", "aurorelle",
               "hiboreal", "ondinelle", "solarion", "yeticime", "phenixol"]
mob_stage_every = 12

# Bosses, in turn: mid-bosses on levels 5, 15, 25…, big bosses on 10, 20, 30… (after the list, it starts again,
# stronger). A boss is its species at that stage (and branch), with mid_boss_scale / boss_scale on its stats.
mid_boss_scale = { hp = 1.5, attack = 1.05, defense = 1.05, speed = 1.0 }
boss_scale = { hp = 2.2, attack = 1.12, defense = 1.1, speed = 1.05 }

