# Species. `names`: one per stage before the final form (egg, baby, young, adult); the final form is one of
# the branches, chosen at the last evolution by the running profile since the pet arrived: the branch with
# the highest metric / reference wins (ties: the first one). Metrics: ascent_per_km (m of D+ per km),
# night_share (share of km run at night, sun below -6°), long_share (share of km in runs of 15 km or more),
# fast_share (share of km faster than 5:00/km), new_share (share of km on paths never run before).
# `base`: stats at level 1 of the young stage (multiplier 1). `starter = true`: adoptable for free, once;
# never sold. `rarity` (rare, epique, legendaire): a shop species (on sale in shop.toml).
#
# Abilities (`[[species.ability]]`), unlocked at a stage (`stage`: baby, young, adult, final), and for the
# final form only with that `branch` if given. `kind`: strike (damage, `power` 100 = a normal blow), guard
# (defence +`value` % for 2 turns), heal (`value` % of the max HP), haste (speed +`value` % for 2 turns),
# drain (a strike that heals `value` % of the damage). Used by the duels (next step); shown on the pet.
# All names are provisional.

